name: Publish release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install and verify dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip check

      - name: Validate tag and application version
        shell: bash
        run: |
          APP_VERSION="$(python -c 'from version import __version__; print(__version__)')"
          test "$GITHUB_REF_NAME" = "v$APP_VERSION"

      - name: Compile and test
        run: |
          python -m compileall -q app.py clients database handlers models promtps repositories services ui version.py
          python -m unittest discover -s tests

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --verify-tag --title "$GITHUB_REF_NAME" --notes-file CHANGELOG.md
