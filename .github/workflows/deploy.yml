name: Deploy bot

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fatsecret-production
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip check

      - name: Validate version and compile sources
        run: |
          python -c "from version import __version__; assert __version__ == '1.0.0'"
          python -m compileall -q app.py clients database handlers models promtps repositories services ui version.py

      - name: Run offline test suite
        run: python -m unittest discover -s tests

  deploy:
    needs: test
    runs-on: ubuntu-latest

    steps:
      - name: Configure SSH
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          set -eu
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/fatsecret_actions
          chmod 600 ~/.ssh/fatsecret_actions
          printf '%s\n' "$VPS_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Deploy to VPS
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          ssh \
            -i ~/.ssh/fatsecret_actions \
            -o IdentitiesOnly=yes \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            "$VPS_USER@$VPS_HOST" 'bash -se' <<'REMOTE'
          set -euo pipefail

          cd /home/deploy/apps/fatsecret-sync-bot

          # Не перезаписываем локальные изменения на сервере.
          if [ -n "$(git status --porcelain --untracked-files=no)" ]; then
            echo "ERROR: Tracked files on VPS have local changes."
            exit 1
          fi

          # Проверяем наличие файлов с секретами и данными.
          test -f .env
          test -f data/app.db

          git fetch origin main
          git checkout main
          git merge --ff-only origin/main

          .venv/bin/python -m pip install -r requirements.txt
          .venv/bin/python -m pip check

          sudo -n /usr/bin/systemctl restart fatsecret-bot.service

          sleep 5
          systemctl is-active --quiet fatsecret-bot.service

          echo "Deployment successful:"
          git rev-parse --short HEAD
          REMOTE
